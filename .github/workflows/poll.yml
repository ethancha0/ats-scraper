name: Poll ATS Job Boards

on:
  schedule:
    # Every 10 minutes. GitHub Actions cron has a practical floor of ~5 min
    # and can lag further during high-load periods -- treat this as
    # "roughly every 10 min," not a hard guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # lets you trigger a run manually from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (print instead of posting to Discord)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # One lane per ATS type, each with its own state file
      # (state/seen_<ats>.json) and its own concurrency group, so a slow
      # board (Greenhouse has ~6k companies) never blocks or races the
      # others. POLL_CONCURRENCY is tuned per lane to roughly match how
      # many companies it's polling.
      matrix:
        include:
          - ats: workday
            concurrency: "50"
          - ats: greenhouse
            concurrency: "60"
          - ats: lever
            concurrency: "40"
          - ats: ashby
            concurrency: "50"
          - ats: smartrecruiters
            concurrency: "40"
          - ats: github
            concurrency: "1"   # unused (single feed fetch, no per-company fan-out)
    concurrency:
      group: poll-${{ matrix.ats }}
      cancel-in-progress: false   # never kill a run that might be mid-commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Poll job boards
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLL_CONCURRENCY: ${{ matrix.concurrency }}
        run: python poll.py --ats=${{ matrix.ats }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          STATE_FILE="state/seen_${{ matrix.ats }}.json"
          git add "$STATE_FILE"
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update seen jobs (${{ matrix.ats }}) [skip ci]"
          # Other matrix lanes touch different files but push to the same
          # branch concurrently, so a non-fast-forward rejection is
          # expected occasionally -- rebase onto the latest and retry.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5), rebasing onto latest and retrying..."
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "::error::Failed to push state for ${{ matrix.ats }} after retries"
          exit 1
