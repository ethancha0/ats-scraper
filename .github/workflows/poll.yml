name: Poll ATS Job Boards

on:
  # Dead-man switch only. The real cadence is the 6-hour inner loop below;
  # GitHub's schedule trigger is too laggy for "every few minutes" and
  # must not start a second 6-hour run while one is already alive.
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print instead of posting to Discord)"
        type: boolean
        default: false
      keep_alive:
        description: "Re-dispatch another 6-hour run when this one finishes"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  # Scheduled ticks are a revive mechanism. Skip if a long-running poll
  # is already in progress so we don't queue a pile of 6-hour jobs.
  guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.check.outputs.continue }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          others=$(gh run list --repo "${{ github.repository }}" \
            --workflow poll.yml --status in_progress \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "${others:-0}" -gt 0 ]; then
            echo "Another poll run is already in progress; skipping this scheduled start."
            echo "continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "continue=true" >> "$GITHUB_OUTPUT"
          fi

  poll:
    needs: [guard]
    if: ${{ always() && (github.event_name != 'schedule' || needs.guard.outputs.continue == 'true') }}
    runs-on: ubuntu-latest
    # GitHub-hosted jobs hard-cap at 6 hours. Leave headroom so the last
    # poll + state push can finish before the runner is killed.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # One lane per ATS type, each with its own state file
      # (state/seen_<ats>.json, saved to its own state/<ats> branch) and
      # its own concurrency group, so a slow board (Greenhouse has ~6k
      # companies) never blocks or races the others. POLL_CONCURRENCY is
      # tuned per lane to roughly match how many companies it's polling.
      # rps caps request starts per second for the whole lane (0 = no cap).
      # interval is the minimum seconds between poll *starts* (a pass that
      # already takes longer just loops immediately).
      matrix:
        include:
          - ats: workday
            concurrency: "50"
            rps: "0"
            interval: "60"
          # Greenhouse's firewall 403'd almost every pass at 60-way
          # concurrency every 60s (~100 req/s). At 8 req/s a full pass of
          # ~6k boards takes ~13 minutes.
          - ats: greenhouse
            concurrency: "10"
            rps: "8"
            interval: "600"
          - ats: lever
            concurrency: "40"
            rps: "0"
            interval: "60"
          - ats: ashby
            concurrency: "50"
            rps: "0"
            interval: "60"
          - ats: smartrecruiters
            concurrency: "40"
            rps: "0"
            interval: "60"
          - ats: github
            concurrency: "1"   # unused (single feed fetch, no per-company fan-out)
            rps: "0"
            interval: "30"
    concurrency:
      group: poll-${{ matrix.ats }}
      cancel-in-progress: false   # never kill a run that might be mid-commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # State lives on a per-lane branch (state/<ats>) holding a single
      # force-pushed commit, not in main's history: committing multi-MB
      # JSON to main every pass pushed the repo toward its size quota, and
      # six lanes rebasing onto each other made pushes fail.
      - name: Restore state
        env:
          STATE_FILE: state/seen_${{ matrix.ats }}.json
          STATE_BRANCH: state/${{ matrix.ats }}
        run: |
          set -euo pipefail
          mkdir -p state
          if git fetch --depth=1 --quiet origin "refs/heads/$STATE_BRANCH"; then
            git show "FETCH_HEAD:$(basename "$STATE_FILE")" > "$STATE_FILE"
            echo "Restored $STATE_FILE from $STATE_BRANCH."
          elif [ -f "$STATE_FILE" ]; then
            # One-time migration: the last copy committed to this branch
            # before state moved to its own branch.
            echo "No $STATE_BRANCH branch yet; starting from the committed $STATE_FILE."
          else
            echo "No saved state; the first pass will seed."
          fi

      - name: Poll until the 6-hour cap
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLL_CONCURRENCY: ${{ matrix.concurrency }}
          POLL_RPS: ${{ matrix.rps }}
          POLL_INTERVAL_SECONDS: ${{ matrix.interval }}
          # Push state at most this often (plus once at the end). Each
          # force-push leaves the previous commit as garbage for GitHub to
          # collect, so this keeps that churn down; the cost is that a
          # runner lost mid-run can re-send up to this window's postings.
          STATE_PUSH_SECONDS: "600"
          STATE_FILE: state/seen_${{ matrix.ats }}.json
          STATE_BRANCH: state/${{ matrix.ats }}
          DRY_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"

          last_pushed_blob=""
          last_push_at=-1000000
          push_state() {
            [ -f "$STATE_FILE" ] || return 0
            local blob tree commit
            blob=$(git hash-object -w "$STATE_FILE")
            if [ "$blob" = "$last_pushed_blob" ]; then
              echo "No state changes to push."
              return 0
            fi
            # Build a parentless commit holding just the state file, without
            # touching the checked-out working tree.
            tree=$(printf '100644 blob %s\t%s\n' "$blob" "$(basename "$STATE_FILE")" | git mktree)
            commit=$(git commit-tree "$tree" -m "Seen jobs (${{ matrix.ats }})")
            for i in 1 2 3; do
              if git push --force --quiet origin "$commit:refs/heads/$STATE_BRANCH"; then
                last_pushed_blob=$blob
                last_push_at=$SECONDS
                echo "State pushed to $STATE_BRANCH."
                return 0
              fi
              sleep $((i * 5))
            done
            echo "::warning::Failed to push state for ${{ matrix.ats }}; will retry after the next pass"
            return 0
          }

          run_once() {
            local started=$SECONDS
            python poll.py --ats=${{ matrix.ats }} $DRY_FLAG
            if [ $((SECONDS - last_push_at)) -ge "$STATE_PUSH_SECONDS" ]; then
              push_state
            fi
            echo "Pass finished in $((SECONDS - started))s"
          }

          if [ -n "$DRY_FLAG" ]; then
            # Dry runs never write state anywhere.
            python poll.py --ats=${{ matrix.ats }} $DRY_FLAG
            exit 0
          fi

          # Stop a few minutes before the job timeout so a slow last pass
          # and the retrigger job can still complete.
          LOOP_SECONDS=$((330 * 60))
          LOOP_END=$((SECONDS + LOOP_SECONDS))
          pass=0
          while [ "$SECONDS" -lt "$LOOP_END" ]; do
            pass=$((pass + 1))
            echo "===== ${{ matrix.ats }} pass $pass ====="
            pass_started=$SECONDS
            run_once || echo "::warning::Pass $pass failed; sleeping and retrying"
            elapsed=$((SECONDS - pass_started))
            remaining_loop=$((LOOP_END - SECONDS))
            if [ "$remaining_loop" -le 0 ]; then
              break
            fi
            sleep_for=$((POLL_INTERVAL_SECONDS - elapsed))
            if [ "$sleep_for" -gt "$remaining_loop" ]; then
              sleep_for=$remaining_loop
            fi
            if [ "$sleep_for" -gt 0 ]; then
              echo "Sleeping ${sleep_for}s to honor start-to-start interval (${POLL_INTERVAL_SECONDS}s)"
              sleep "$sleep_for"
            fi
          done
          push_state
          echo "Loop budget exhausted after $pass pass(es); handing off to retrigger."

  retrigger:
    needs: [poll]
    runs-on: ubuntu-latest
    # workflow_dispatch inputs are empty strings on `schedule` events.
    # `inputs.keep_alive != false` then evaluates false and used to skip
    # this job, which killed the 6-hour chain after a cron-started run.
    # Scheduled runs should always hand off; dispatch still honors the
    # keep_alive / dry_run checkboxes.
    if: ${{ always() && !cancelled() && needs.poll.result != 'skipped' && (github.event_name == 'schedule' || (inputs.dry_run != true && inputs.keep_alive != false)) }}
    steps:
      - name: Start the next 6-hour run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No checkout in this job, so gh can't infer the repo from a local
        # clone -- without --repo it fails with "not a git repository" and
        # the chain dies until the next cron tick.
        run: gh workflow run poll.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
